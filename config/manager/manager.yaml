apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: alb-maintenance
    app.kubernetes.io/name: app-maintenance-operator
    app.kubernetes.io/component: controller
    app.kubernetes.io/version: v1.2.2
    app.kubernetes.io/managed-by: kustomize
  name: alb-maintenance-operator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alb-maintenance
  namespace: alb-maintenance-operator
  labels:
    control-plane: alb-maintenance
    app.kubernetes.io/name: app-maintenance-operator
    app.kubernetes.io/component: controller
    app.kubernetes.io/version: v1.2.2
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: alb-maintenance
      app.kubernetes.io/name: app-maintenance-operator
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: alb-maintenance
        app.kubernetes.io/name: app-maintenance-operator
        app.kubernetes.io/component: controller
        app.kubernetes.io/version: v1.2.2
    spec:
      # Optional node affinity can restrict scheduling to architectures published
      # by the release image. The published image supports linux/amd64 and
      # linux/arm64.
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #         - matchExpressions:
      #           - key: kubernetes.io/arch
      #             operator: In
      #             values:
      #               - amd64
      #               - arm64
      #               - ppc64le
      #               - s390x
      #           - key: kubernetes.io/os
      #             operator: In
      #             values:
      #               - linux
      securityContext:
        # Projects are configured by default to adhere to the "restricted" Pod Security Standards.
        # This ensures that deployments meet the highest security requirements for Kubernetes.
        # For more details, see: https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - command:
        - /manager
        args:
          - --leader-elect
          - --health-probe-bind-address=:8081
        # Overridden by release overlays in config/default and config/namespaced.
        image: controller:latest
        name: manager
        env:
        - name: OPERATOR_VERSION
          value: v1.2.2
        ports:
        - containerPort: 8081
          name: health
          protocol: TCP
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        # Conservative defaults for a lightweight controller. Tune for larger
        # clusters after observing reconcile latency and memory usage.
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        volumeMounts: []
      volumes: []
      serviceAccountName: alb-maintenance
      terminationGracePeriodSeconds: 10
